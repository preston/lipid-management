<div
  class="toast-container position-fixed bottom-0 end-0 p-3"
  id="app-toast-container"
  aria-live="polite"
  aria-atomic="true"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast show align-items-center border-0 mb-2"
      [class.text-bg-success]="toast.variant === 'success'"
      [class.text-bg-danger]="toast.variant === 'danger'"
      [class.text-bg-warning]="toast.variant === 'warning'"
      [class.text-bg-info]="toast.variant === 'info'"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      [id]="toast.id"
    >
      <div class="d-flex">
        <div class="toast-body" [id]="toast.id + '-body'">{{ toast.message }}</div>
        <button
          type="button"
          class="btn-close me-2 m-auto"
          [class.btn-close-white]="toast.variant === 'danger' || toast.variant === 'success' || toast.variant === 'info'"
          [attr.aria-label]="'Dismiss notification'"
          [id]="toast.id + '-dismiss'"
          (click)="toastService.dismiss(toast.id)"
        ></button>
      </div>
    </div>
  }
</div>
